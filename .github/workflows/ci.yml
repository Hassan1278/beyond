name: Scaffold checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scaffold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: Dependencies and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - name: Install from the root lockfile
        run: npm ci --no-audit --no-fund
      - name: Check dependency resolution
        run: npm run check:deps
      - name: Check documentation and configuration formatting
        run: npm run format:check
      - name: Check backend lint
        run: npm run lint:backend
      - name: Check backend types
        run: npm run typecheck:backend
      - name: Run backend unit tests
        run: npm run test:backend
      - name: Build independent product API
        run: npm run build:api
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Smoke-test production API health
        run: npm run test:api:smoke
      # Real database acceptance, frontend builds and native exports remain separate gates.
