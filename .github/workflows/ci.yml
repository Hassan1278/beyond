name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scaffold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: Dependencies and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - name: Install from the root lockfile
        run: npm ci --no-audit --no-fund
      - name: Check dependency resolution
        run: npm run check:deps
      - name: Check documentation and configuration formatting
        run: npm run format:check
      - name: Check backend lint
        run: npm run lint:backend
      - name: Check backend types
        run: npm run typecheck:backend
      - name: Run backend unit tests
        run: npm run test:backend
      - name: Build independent product API
        run: npm run build:api
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Smoke-test production API health
        run: npm run test:api:smoke
      # Frontend builds and native exports remain separate gates.

  writing:
    name: Real local Auth and Postgres backend acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - name: Install from the root lockfile
        run: npm ci --no-audit --no-fund
      - name: Start writing-only local Supabase
        run: npx --no-install supabase start --exclude realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Test database permissions and private RPCs
        run: npm run db:test
      - name: Build independent API
        run: npm run build:api
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install browser for real integration acceptance
        run: npx --no-install playwright install --with-deps chromium
      - name: Build connected browser against local public Supabase settings
        run: node tests/build-connected-web.mjs
      - name: Test production private API, connected browser and account cleanup
        run: npm run test:api:writing
        env:
          TEST_CONNECTED_BROWSER: 'true'
      - name: Stop local Supabase
        if: always()
        run: npx --no-install supabase stop

  frontend:
    name: Connected web and mobile checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - name: Install root workspaces
        run: npm ci --no-audit --no-fund
      - name: Check frontend lint and types
        run: npm run lint:frontend && npm run typecheck:frontend
      - name: Test account switching, retries and secure session storage
        run: npm run test:frontend
      - name: Render original designs and verify palette
        run: npm run test:design && npm run test:palette
      - name: Build production website
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Export Android and iOS JavaScript including shared DOM screens
        run: npm run check:mobile
